name: CI

# Every change is held to the same checks a developer runs by hand: types, lint, unit tests, and
# the browser suite, which includes the stability audit and the performance budgets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm check

      - name: Formatting and lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec vitest --run

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Builds the project and starts the production and development servers itself.
      - name: Browser tests
        run: pnpm exec playwright test

      - name: Keep the evidence when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
